<!--
  Template de e-mail de convite do Meiro.
  Como usar: Supabase Dashboard → Authentication → Email Templates → "Invite user"
  Cole o conteúdo abaixo no campo "Message body (HTML)" e salve.
  Variáveis do Supabase usadas: {{ .ConfirmationURL }}
-->
<div style="background-color:#fafaf8;padding:40px 16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;margin:0 auto;">
    <tr>
      <td style="background-color:#ffffff;border:1px solid #e7e7e5;border-radius:16px;padding:40px 32px;text-align:center;">

        <img src="https://withmeiro.xyz/logo-mark.png" width="48" height="48" alt="Meiro" style="display:block;width:48px;height:48px;border-radius:10px;margin:0 auto 24px;" />

        <h1 style="font-size:20px;font-weight:600;color:#171717;margin:0 0 8px;letter-spacing:-0.02em;">
          Seu acesso ao Meiro está liberado
        </h1>

        <p style="font-size:14px;line-height:1.6;color:#909090;margin:0 0 28px;">
          Você foi aprovado para o beta do Meiro. Clique no botão abaixo para criar sua senha e começar a organizar
          sua vida acadêmica em um único lugar.
        </p>

        <a href="{{ .ConfirmationURL }}"
           style="display:inline-block;background-color:#6366f1;color:#ffffff;text-decoration:none;font-size:14px;font-weight:600;padding:11px 28px;border-radius:10px;">
          Criar minha senha
        </a>

        <p style="font-size:12px;color:#909090;margin:28px 0 0;">
          Se você não esperava este convite, pode ignorar este e-mail com segurança.
        </p>
      </td>
    </tr>
    <tr>
      <td style="text-align:center;padding-top:20px;">
        <p style="font-size:11px;color:#909090;margin:0;">© Meiro</p>
      </td>
    </tr>
  </table>
</div>
